[project]
name = "semiconductor-mc-kmc-lab"
version = "0.2.0"
description = "Modular Monte Carlo and Kinetic Monte Carlo semiconductor process simulation prototypes"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "Pillow>=10.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
